# ===============================
# Basic Site Settings
# ===============================
locale                   : "en-US"
site_theme               : "default"

title                    : "Fan Zheming"
title_separator          : "-"
name                     : &name "Fan Zheming"
description              : &description "Master’s student at the School of Software, Shandong University. Research focus on Large Language Models."

url                      : "https://fan-zheming.github.io"
baseurl                  : ""
repository               : "fan-zheming/fan-zheming.github.io"

# ===============================
# Site Author (Sidebar Profile)
# ===============================
author:
  avatar           : "fanzheming.jpg"   # 放在 images/profile.png
  name             : "Fan Zheming"
  bio              : "M.S. student at Shandong University. Research on Large Language Models."
  location         : "Jinan, China"
  employer         : "School of Software, Shandong University"
  email            : "fanzheming@mail.sdu.edu.cn"

  # Academic profiles
  googlescholar    :     # 之后有了再填
  orcid            :
  semantic         :
  researchgate     :

  # Code & Repositories
  github           : "fan-zheming"

  # Social (可不填)
  linkedin         :
  twitter          :
  zhihu            :

# ===============================
# Publication Categories
# ===============================
publication_category:
  manuscripts:
    title: "Journal Articles"
  conferences:
    title: "Conference Papers"

# ===============================
# Site Behavior
# ===============================
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# ===============================
# Analytics (关闭)
# ===============================
analytics:
  provider               : false

# ===============================
# Reading Files
# ===============================
include:
  - _pages
  - files
exclude:
  - .github
  - node_modules
  - vendor
  - Gemfile
  - README
  - LICENSE

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# ===============================
# Markdown & Rendering
# ===============================
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  auto_ids: true
  toc_levels: 1..6

# ===============================
# Collections
# ===============================
collections:
  publications:
    output: true
    permalink: /publications/:path/
  talks:
    output: true
    permalink: /talks/:path/
  teaching:
    output: true
    permalink: /teaching/:path/

# ===============================
# Defaults
# ===============================
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true

  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# ===============================
# Permalinks & Timezone
# ===============================
permalink: /:title/
timezone: Asia/Shanghai

# ===============================
# Plugins (GitHub Pages safe)
# ===============================
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
